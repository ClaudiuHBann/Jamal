name: Build Docker image

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Linux amd64 image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and export image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          pull: true
          push: false
          tags: |
            discord-music-bot:ci
            discord-music-bot:${{ github.sha }}
          outputs: type=docker,dest=${{ runner.temp }}/discord-music-bot-image.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Compress image archive
        run: gzip -1 "${RUNNER_TEMP}/discord-music-bot-image.tar"

      - name: Upload image archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ runner.temp }}/discord-music-bot-image.tar.gz
          archive: false
          if-no-files-found: error
          retention-days: 14
